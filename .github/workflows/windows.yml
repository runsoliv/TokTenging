name: Windows tests and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q tok tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist/ci --workpath build/ci "Tok Tenging.spec"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Tok-Tenging-Windows
          path: dist/ci/Tok Tenging.exe
          if-no-files-found: error
